# Volby Brno — statický web (obsah web/index.html).
# Fedora: cp apache/volby-brno.conf /etc/httpd/conf.d/volby-brno.conf
#         install -d -o root -g root -m 755 /var/www/volby-brno
#         install -o root -g root -m 644 web/index.html /var/www/volby-brno/index.html
#         systemctl reload httpd
# Debian/Ubuntu: logy jsou v /var/log/apache2/ a soubor patří do sites-available.

<VirtualHost *:80>
    ServerName brno.volby.varhoo.cz

    DocumentRoot /var/www/volby-brno

    <Directory /var/www/volby-brno>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        AddDefaultCharset UTF-8
    </Directory>

    AddType application/manifest+json .webmanifest

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml application/xml application/json application/manifest+json application/javascript image/svg+xml image/x-icon
    </IfModule>

    # Ikony a obrázky se mění zřídka; index.html se nesmí držet v cache dlouho.
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        ExpiresByType image/x-icon "access plus 1 month"
        ExpiresByType image/vnd.microsoft.icon "access plus 1 month"
        ExpiresByType text/html "access plus 10 minutes"
    </IfModule>

</VirtualHost>
