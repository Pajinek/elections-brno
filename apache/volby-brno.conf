# Volby Brno — statický web (obsah web/index.html).
# Fedora: cp apache/volby-brno.conf /etc/httpd/conf.d/volby-brno.conf
#         install -d -o root -g root -m 755 /var/www/volby-brno
#         install -o root -g root -m 644 web/index.html /var/www/volby-brno/index.html
#         systemctl reload httpd
# Debian/Ubuntu: logy jsou v /var/log/apache2/ a soubor patří do sites-available.

<VirtualHost *:80>
    ServerName brno.volby.varhoo.cz

    DocumentRoot /var/www/volby-brno

    <Directory /var/www/volby-brno>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        AddDefaultCharset UTF-8
    </Directory>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript image/svg+xml
    </IfModule>

</VirtualHost>
