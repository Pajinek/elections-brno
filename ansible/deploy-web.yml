---
# Nasadí soubory z web/ na hosty z inventáře.
# Adresář web/_src (checkout pro build) a zdroje buildu (build.py, template.html, head.html,
# artifact.html, logo.png) se nekopírují, ať se nepublikuje duplicitní obsah.
# Inventář ansible/hosts není v gitu: cp ansible/hosts.example ansible/hosts
#
#   ansible-playbook -i ansible/hosts ansible/deploy-web.yml

- name: Nasadit web Volby Brno
  hosts: all
  vars:
    web_root: /var/www/volby-brno

  tasks:
    - name: Adresář webu
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Soubory z web/
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ web_root }}/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ query('fileglob', playbook_dir + '/../web/*') | reject('search', '/(build\\.py|template\\.html|head\\.html|artifact\\.html|logo\\.png)$') | list }}"
